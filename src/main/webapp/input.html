<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>成绩管理系统 - 注册</title>
</head>
<body>
<h3>成绩管理系统 注册</h3>
<form action="register.do" method="post">
<p>用户名：<input type="text" name="username" size="20"></p>
<p>密&nbsp;&nbsp;&nbsp;&nbsp;码：<input type="password" name="password" size="20"></p>
<p>确认密码：<input type="password" name="password2" size="20"></p>
<p>性&nbsp;&nbsp;&nbsp;&nbsp;别：<input type="radio" name="sex" value="男" checked>男
<input type="radio" name="sex" value="女">女</p>
<p>电子邮箱：<input type="text" name="email" size="20"></p>
<p>手机号码：<input type="text" name="phone" size="20"></p>
<p>所在班级：<input type="text" name="clazz" size="20"></p>
<p><input type="submit" value="注册"><input type="reset" value="重置"></p>
</form>
</body>
</html>
